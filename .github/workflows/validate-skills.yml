# validate-skills: structural gate over skill frontmatter.
#
# Exists because of #131. Two sessions independently split trigger lists on the literal
# `Triggers:`, silently dropped the four skills that use `Triggers EN:` / `Triggers ES:`, and
# both reported those four as carrying zero triggers. Neither query errored; a filter can only
# confirm the rows it already matches. S4 therefore ENUMERATES the label space on every run.
#
# ~1s, no IRIS, no network.

name: validate-skills

on:
  push:
    paths:
      - 'skills/**'
      # The other files the validator opens. Without them a release PR -- which edits nothing but
      # the two manifests -- ran no check at all, though S10 exists to catch a half-bumped version.
      - '.claude-plugin/plugin.json'      # S6 hook count, S10 version
      - '.claude-plugin/marketplace.json' # S6 hook count, S10 version (both fields)
      - 'hooks/hooks.json'                # S6 hook count
      - 'README.md'                       # S6 hook table
      - 'scripts/skills_baseline.json'    # S8 token ratchet
      - 'scripts/validate_skills.py'
      - '.github/workflows/validate-skills.yml'
  pull_request:
    paths:
      - 'skills/**'
      # The other files the validator opens. Without them a release PR -- which edits nothing but
      # the two manifests -- ran no check at all, though S10 exists to catch a half-bumped version.
      - '.claude-plugin/plugin.json'      # S6 hook count, S10 version
      - '.claude-plugin/marketplace.json' # S6 hook count, S10 version (both fields)
      - 'hooks/hooks.json'                # S6 hook count
      - 'README.md'                       # S6 hook table
      - 'scripts/skills_baseline.json'    # S8 token ratchet
      - 'scripts/validate_skills.py'
      - '.github/workflows/validate-skills.yml'
  workflow_dispatch:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: skill frontmatter checks
        run: python3 scripts/validate_skills.py

      # Link 1 of the #418 path-filter gate: run the validator under an audit hook and fail
      # if it touched a tracked file that its declared INPUTS do not cover. A NEW read is the
      # one thing no static deriver can be trusted with — when a deriver stops recognising a
      # call site it reports a SMALLER set, and "0 unwatched" is what a dead deriver says.
      # This is the job for the change that added the read, which is why it runs here.
      - name: CI path-filter coverage (link 1 — trace validate_skills.py)
        run: python3 scripts/validate_ci_paths.py --trace scripts/validate_skills.py
